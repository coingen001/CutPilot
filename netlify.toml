[build]
  command = "npm run build"
  publish = "dist"

# Anteprima provvisoria: fuori da Google finché nome e dominio non sono definitivi.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Il vecchio indirizzo inglese porta alla versione per gli Stati Uniti.
[[redirects]]
  from = "/en/*"
  to = "/en-us/:splat"
  status = 301
